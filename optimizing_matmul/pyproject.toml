# `pyproject.toml` defines the uv project for the Python scripts and the dev tools.
#
# Interface:
#     dev dependency group: ruff, clang-format and clang-tidy.
#
# Example:
#     uv run ruff check .
[project]
name = "optimizing-matmul"
version = "0.1.0"
description = "Optimizing a bf16 matmul kernel on an H100"
requires-python = ">=3.10"
dependencies = ["click>=8.1"]

[dependency-groups]
dev = ["ruff", "clang-format", "clang-tidy"]

[tool.uv]
package = false
